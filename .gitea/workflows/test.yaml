name: Tests
# Runs the repo's offline test suites on the cluster's gitea Actions runner:
# the kb-client's stdlib-only Python tests and the gateway's node:test tests.
# None needs the network, a database or a backend, so they gate every push
# without depending on kb.internal being up. The gateway tests are TypeScript
# run by plain Node, which strips the types itself from Node 23.6 on — hence the
# pinned Node below, and no `npm ci`: those tests import nothing from node_modules.
# The browser tests (`npm run test:e2e`) need an installed instance and are not
# run here. The test command lives in package.json (`npm test`) so CI and local
# stay one source.
on:
  push:
    # develop is where work lands day to day (main is the stable line), so it must
    # be gated too — otherwise the guard goes quiet exactly where new code arrives.
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Offline test suites (kb-client + gateway)
        run: npm test
